      <div class="panel">
        <h2>🔬 Anatomía de un método</h2>
        <pre><span class="k">public static int</span> sumar(<span class="k">int</span> a, <span class="k">int</span> b) {
    <span class="k">int</span> suma = a + b;
    <span class="k">return</span> suma;
}</pre>
        <table>
          <tr><th>Parte</th><th>En el ejemplo</th><th>Qué indica</th></tr>
          <tr><td>Modificadores</td><td><code>public static</code></td><td>Quién puede usarlo y que se llama sin crear un objeto.</td></tr>
          <tr><td>Tipo de retorno</td><td><code>int</code></td><td>Tipo del valor que devuelve (<code>void</code> si no devuelve nada).</td></tr>
          <tr><td>Nombre</td><td><code>sumar</code></td><td>Identificador con el que se invoca.</td></tr>
          <tr><td>Parámetros</td><td><code>int a, int b</code></td><td>Datos de entrada que recibe.</td></tr>
          <tr><td>Cuerpo</td><td><code>{ ... }</code></td><td>Instrucciones que ejecuta.</td></tr>
          <tr><td>Retorno</td><td><code>return suma;</code></td><td>Entrega el resultado a quien lo llamó.</td></tr>
        </table>
      </div>

      <div class="panel">
        <h2>🚫 Métodos <code>void</code></h2>
        <p>No devuelven ningún valor: <b>ejecutan una acción</b> (mostrar, imprimir, modificar).</p>
        <pre><span class="k">public static void</span> mostrarSuma(<span class="k">int</span> a, <span class="k">int</span> b) {
    System.out.println(<span class="s">"Suma: "</span> + (a + b));
}

<span class="c">// Uso</span>
mostrarSuma(3, 4);          <span class="c">// imprime: Suma: 7</span></pre>
      </div>

      <div class="panel">
        <h2>🔁 Métodos con <code>return</code></h2>
        <p>Devuelven un valor que puede <b>guardarse o usarse</b> en otra parte del programa.</p>
        <pre><span class="k">public static int</span> multiplicar(<span class="k">int</span> a, <span class="k">int</span> b) {
    <span class="k">return</span> a * b;
}

<span class="c">// Uso</span>
<span class="k">int</span> r = multiplicar(3, 4);   <span class="c">// r vale 12</span></pre>
      </div>

      <div class="panel">
        <h2>⚖️ <code>void</code> vs <code>return</code></h2>
        <table>
          <tr><th>Aspecto</th><th><code>void</code></th><th><code>return</code></th></tr>
          <tr><td>¿Devuelve un valor?</td><td>No</td><td>Sí</td></tr>
          <tr><td>Tipo en la firma</td><td><code>void</code></td><td><code>int</code>, <code>double</code>, <code>String</code>…</td></tr>
          <tr><td>Se puede guardar el resultado</td><td>No</td><td>Sí: <code>int r = metodo();</code></td></tr>
          <tr><td>Cuándo usarlo</td><td>Mostrar, imprimir, modificar</td><td>Calcular y entregar un dato</td></tr>
        </table>
      </div>

      <div class="panel">
        <h2>🔄 Ciclo del método</h2>
        <div class="flow">
          <div class="step"><div class="circ">1</div><div class="st">Declarar</div><div class="sd">Se escribe el método</div></div>
          <div class="arr">→</div>
          <div class="step"><div class="circ b">2</div><div class="st">Invocar</div><div class="sd">Se llama desde <code>main</code></div></div>
          <div class="arr">→</div>
          <div class="step"><div class="circ g">3</div><div class="st">Ejecutar</div><div class="sd">Corre el cuerpo</div></div>
          <div class="arr">→</div>
          <div class="step"><div class="circ b">4</div><div class="st">Volver</div><div class="sd">Retorna al punto de la llamada</div></div>
        </div>
        <p class="cap">Figura 2. Recorrido de una llamada a un método.</p>
      </div>

      <div class="panel">
        <h2>🛠️ Compilación</h2>
        <p>Java compila con <code>javac</code> y ejecuta con <code>java</code>. Errores típicos con métodos:</p>
        <table>
          <tr><th>Error</th><th>Causa</th></tr>
          <tr><td><code>missing return statement</code></td><td>Un método con tipo de retorno no devuelve nada en algún camino.</td></tr>
          <tr><td><code>incompatible types</code></td><td>El valor devuelto no coincide con el tipo declarado.</td></tr>
          <tr><td><code>cannot find symbol</code></td><td>Se invoca un método que no existe o con otro nombre.</td></tr>
        </table>
        <pre>javac Main.java
java Main</pre>
      </div>

