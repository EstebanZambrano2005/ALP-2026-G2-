      p{margin:0 0 8px}
      table{width:100%;border-collapse:collapse;font-size:14px}
      th{background:rgba(15,61,46,.9);color:#5EF2A8;text-align:left;padding:9px 12px;border:1px solid rgba(94,242,168,.25)}
      td{padding:9px 12px;border:1px solid rgba(94,242,168,.2)}
      code{background:rgba(94,242,168,.15);color:#6EE7B7;font-family:Consolas,'Courier New',monospace;padding:1px 6px;border-radius:4px;font-size:13px}
      pre{background:rgba(2,10,7,.88);border:1px solid rgba(94,242,168,.25);border-radius:8px;padding:12px 16px;font-family:Consolas,'Courier New',monospace;font-size:14px;color:#A7F3D0;margin:10px 0;white-space:pre;line-height:1.45}
      .k{color:#5EF2A8;font-weight:700}.s{color:#FCD34D}.c{color:#6B8F82}
