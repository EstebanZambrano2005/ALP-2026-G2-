        <div>
          <span class="n">Equipo</span><span class="n">Ruta de la clase</span><span class="n">¿Qué es un método?</span><span class="n">Anatomía</span><span class="n">void</span><span class="n">return</span><span class="n">void vs return</span><span class="n">Estructura</span>
        </div>
      </div>

      <div class="panel" style="margin-top:24px">
        <h2>👥 Equipo</h2>
