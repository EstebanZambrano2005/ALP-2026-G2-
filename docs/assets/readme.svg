        </table>
      </div>

      <div class="panel">
        <h2>🔎 Ruta de la clase</h2>
        <table>
          <tr><th>Fase</th><th>Momento</th><th>Qué hacemos</th></tr>
          <tr><td><code>01</code></td><td>Diagnóstico</td><td>Prueba diagnóstica para medir lo que ya se sabe de métodos.</td></tr>
          <tr><td><code>02</code></td><td>Teoría</td><td>¿Qué es un método? Anatomía, <code>void</code> y <code>return</code>.</td></tr>
          <tr><td><code>03</code></td><td>Código</td><td>Ejemplos de código escritos y probados en vivo.</td></tr>
          <tr><td><code>04</code></td><td>Comparación</td><td><code>void</code> vs <code>return</code>: cuándo usar cada uno.</td></tr>
