        </table>
      </div>

      <div class="panel">
        <h2>🧩 ¿Qué es un método?</h2>
        <p>Un <b>método</b> es un bloque de código con nombre que realiza una tarea específica y se puede <b>reutilizar</b> las veces que haga falta, sin repetir código.</p>
        <pre><span class="k">public static void</span> saludar() {
    System.out.println(<span class="s">"Hola, mundo"</span>);
}</pre>
      </div>

      <div class="panel">
        <h2>🔬 Anatomía de un método</h2>
        <pre><span class="k">public static int</span> sumar(<span class="k">int</span> a, <span class="k">int</span> b) {
    <span class="k">return</span> a + b;
}</pre>
        <table>
          <tr><th>Parte</th><th>En el ejemplo</th><th>Función</th></tr>
          <tr><td>Modificadores</td><td><code>public static</code></td><td>Define el acceso y si pertenece a la clase.</td></tr>
          <tr><td>Tipo de retorno</td><td><code>int</code></td><td>Tipo de dato que devuelve (<code>void</code> si no devuelve nada).</td></tr>
          <tr><td>Nombre</td><td><code>sumar</code></td><td>Identifica al método.</td></tr>
          <tr><td>Parámetros</td><td><code>int a, int b</code></td><td>Datos de entrada.</td></tr>
          <tr><td>Cuerpo</td><td><code>{ ... }</code></td><td>Instrucciones que ejecuta.</td></tr>
        </table>
      </div>

      <div class="panel">
        <h2>🚫 Métodos <code>void</code></h2>
        <p>No devuelven ningún valor: <b>ejecutan una acción</b>.</p>
        <pre><span class="k">public static void</span> mostrarSuma(<span class="k">int</span> a, <span class="k">int</span> b) {
    System.out.println(<span class="s">"Suma: "</span> + (a + b));
}</pre>
      </div>

      <div class="panel">
        <h2>🔁 Métodos con <code>return</code></h2>
        <p>Devuelven un valor que puede <b>guardarse o usarse</b> en otra parte del programa.</p>
        <pre><span class="k">public static int</span> multiplicar(<span class="k">int</span> a, <span class="k">int</span> b) {
    <span class="k">return</span> a * b;
}

<span class="c">// Uso</span>
<span class="k">int</span> resultado = multiplicar(4, 5); <span class="c">// resultado = 20</span></pre>
      </div>

      <div class="panel">
        <h2>⚖️ <code>void</code> vs <code>return</code></h2>
        <table>
          <tr><th>Característica</th><th class="ok"><code>void</code></th><th class="ok"><code>return</code></th></tr>
          <tr><td>Devuelve un valor</td><td class="ok">❌</td><td class="ok">✅</td></tr>
          <tr><td>Tipo de retorno</td><td class="ok"><code>void</code></td><td class="ok"><code>int</code>, <code>double</code>, <code>String</code>...</td></tr>
          <tr><td>Se puede guardar en una variable</td><td class="ok">❌</td><td class="ok">✅</td></tr>
          <tr><td>Uso típico</td><td class="ok">Mostrar, imprimir, modificar</td><td class="ok">Calcular y entregar un resultado</td></tr>
        </table>
      </div>

      <div class="panel">
