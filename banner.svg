<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1f3b46"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9d"/>
      <stop offset="1" stop-color="#7dffcf"/>
    </linearGradient>
    <linearGradient id="sep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9d" stop-opacity="1"/>
      <stop offset="1" stop-color="#00ff9d" stop-opacity="0"/>
    </linearGradient>
    <path id="wave" d="M 82 250 Q 111 222 140 250 T 220 250 T 300 250 T 380 250 T 460 250 T 540 250 T 620 250 T 700 250 T 780 250 T 860 250 L 880 250"/>
  </defs>

  <rect width="1000" height="360" fill="url(#bg)"/>

  <g transform="translate(0,20)">

    <!-- Estrellas -->
    <g fill="#ffffff">
      <circle cx="90" cy="40" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="95" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="45" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="110" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="60" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="180" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Etiqueta superior -->
    <rect x="290" y="10" width="300" height="30" rx="15" fill="none" stroke="#00ff9d" stroke-width="1.2" opacity="0.7"/>
    <text x="440" y="33" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#7dffcf">PROYECTO INTEGRADOR</text>

    <!-- Titulo principal -->
    <text x="440" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="1" fill="url(#txt)">AulaLógica Web</text>

    <!-- Separador -->
    <rect x="130" y="133" width="620" height="2" fill="url(#sep)"/>

    <!-- Subtitulo -->
    <text x="440" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0.8" fill="#d1fae5">Aplicativo didáctico de Fundamentos de Programación en Java</text>

    <!-- Grupo y APE -->
    <text x="440" y="203" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#7dffcf">GRUPO 2  ·  APE 4</text>

    <!-- Emisor: bombilla con engranajes (izquierda) -->
    <g transform="translate(46,262) scale(1.5)">
      <circle cx="0" cy="-7" r="26" fill="#00ff9d" opacity="0.15">
        <animate attributeName="r" values="22;32;22" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0.03;0.25" dur="2s" repeatCount="indefinite"/>
      </circle>
      <!-- Rayos de idea -->
      <g stroke="#7dffcf" stroke-width="1.6" stroke-linecap="round">
        <line x1="-14" y1="-31" x2="-17" y2="-38"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.25s" repeatCount="indefinite"/></line>
        <line x1="0" y1="-34" x2="0" y2="-41"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></line>
        <line x1="14" y1="-31" x2="17" y2="-38"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.75s" repeatCount="indefinite"/></line>
      </g>
      <!-- Bulbo -->
      <path d="M -9 12 C -9 8 -19 4 -19 -7 A 19 19 0 1 1 19 -7 C 19 4 9 8 9 12 Z" fill="#07140f" stroke="#00ff9d" stroke-width="2" stroke-linejoin="round"/>
      <rect x="-8" y="14" width="16" height="4" rx="1.5" fill="#0f5f55" stroke="#00ff9d" stroke-width="1"/>
      <rect x="-6" y="19.5" width="12" height="4" rx="1.5" fill="#0f5f55" stroke="#00ff9d" stroke-width="1"/>
      <rect x="-3" y="25" width="6" height="3" rx="1.5" fill="#00ff9d"/>
      <!-- Engranaje grande -->
      <g transform="translate(-4,-8)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
          <polygon points="7.0,-2.9 9.9,-1.7 9.9,1.7 7.0,2.9 7.0,2.9 8.2,5.8 5.8,8.2 2.9,7.0 2.9,7.0 1.7,9.9 -1.7,9.9 -2.9,7.0 -2.9,7.0 -5.8,8.2 -8.2,5.8 -7.0,2.9 -7.0,2.9 -9.9,1.7 -9.9,-1.7 -7.0,-2.9 -7.0,-2.9 -8.2,-5.8 -5.8,-8.2 -2.9,-7.0 -2.9,-7.0 -1.7,-9.9 1.7,-9.9 2.9,-7.0 2.9,-7.0 5.8,-8.2 8.2,-5.8 7.0,-2.9" fill="#00ff9d"/>
          <circle r="3.4" fill="#07140f"/>
        </g>
      </g>
      <!-- Engranaje pequeno (gira al reves) -->
      <g transform="translate(8.5,-1)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="30" to="-330" dur="6s" repeatCount="indefinite"/>
          <polygon points="4.0,-2.3 6.3,-1.5 6.3,1.5 4.0,2.3 4.0,2.3 4.4,4.7 1.9,6.2 0.0,4.6 0.0,4.6 -1.9,6.2 -4.4,4.7 -4.0,2.3 -4.0,2.3 -6.3,1.5 -6.3,-1.5 -4.0,-2.3 -4.0,-2.3 -4.4,-4.7 -1.9,-6.2 0.0,-4.6 0.0,-4.6 1.9,-6.2 4.4,-4.7 4.0,-2.3" fill="#7dffcf"/>
          <circle r="2.2" fill="#07140f"/>
        </g>
      </g>
    </g>

    <!-- Red inalambrica fina y horizontal -->
    <use href="#wave" fill="none" stroke="#00ff9d" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.6s" repeatCount="indefinite"/>
    </use>
    <use href="#wave" fill="none" stroke="#d1fae5" stroke-width="0.8" stroke-dasharray="2 14" opacity="0.8" transform="translate(0,6)">
      <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.2s" repeatCount="indefinite"/>
    </use>
    <g fill="#ffffff">
      <circle r="3"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#wave"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#wave"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#wave"/></animateMotion></circle>
    </g>

    <!-- Cerebro digital (derecha) -->
    <g transform="translate(925,250) scale(1.1)">
      <circle cx="0" cy="-2" r="62" fill="#00ff9d" opacity="0.08">
        <animate attributeName="r" values="56;70;56" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.14;0.02;0.14" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M -40 20 C -58 18 -62 -6 -48 -16 C -52 -34 -30 -42 -20 -34 C -12 -46 12 -46 20 -34 C 34 -42 54 -30 48 -14 C 62 -6 58 18 40 20 C 38 32 20 36 12 28 L 10 40 L -8 40 L -10 28 C -22 36 -38 32 -40 20 Z" fill="#07140f" stroke="#00ff9d" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 0 -42 C 6 -24 -6 -10 0 4 C 5 14 -2 20 0 28" fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.45"/>
      <!-- Circuitos con flujo de datos -->
      <g fill="none" stroke="#7dffcf" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5">
        <path d="M -48 -8 H -32 V 2 H -8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.4s" repeatCount="indefinite"/></path>
        <path d="M -46 10 H -30 V 18 H -10"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.8s" repeatCount="indefinite"/></path>
        <path d="M -30 -28 V -16 H -12"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/></path>
        <path d="M 46 -8 H 32 V 2 H 8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.5s" repeatCount="indefinite"/></path>
        <path d="M 44 10 H 28 V 18 H 10"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.9s" repeatCount="indefinite"/></path>
        <path d="M 30 -28 V -16 H 12"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.7s" repeatCount="indefinite"/></path>
      </g>
      <!-- Nodos -->
      <g fill="#00ff9d">
        <circle cx="-48" cy="-8" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
        <circle cx="-8" cy="2" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></circle>
        <circle cx="-46" cy="10" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></circle>
        <circle cx="-10" cy="18" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.9s" repeatCount="indefinite"/></circle>
        <circle cx="-30" cy="-28" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.2s" repeatCount="indefinite"/></circle>
        <circle cx="-12" cy="-16" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></circle>
        <circle cx="46" cy="-8" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
        <circle cx="8" cy="2" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.7s" repeatCount="indefinite"/></circle>
        <circle cx="44" cy="10" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
        <circle cx="10" cy="18" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.1s" repeatCount="indefinite"/></circle>
        <circle cx="30" cy="-28" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle cx="12" cy="-16" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="1.1s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- Llegada de la red al cerebro -->
    <circle cx="858" cy="250" r="6" fill="#00ff9d" opacity="0.6">
      <animate attributeName="r" values="4;18;4" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.6s" repeatCount="indefinite"/>
    </circle>

  </g>
</svg>
